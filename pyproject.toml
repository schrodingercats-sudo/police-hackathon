[project]
name = "stolen-vehicle-ai"
version = "1.0.0"
description = "Indian Police Stolen Vehicle AI Command Center"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "opencv-python-headless>=4.8.0.76",
    "numpy>=1.24.0",
    "pillow>=10.2.0",
    "scipy>=1.11.0",
    "python-dateutil>=2.8.2",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "vision*", "pipeline*"]
exclude = ["data*", "frontend*", "tests*", "scripts*", "graphify-out*", ".vercel*"]
