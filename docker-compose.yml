version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI REST API & Police Command Center Web Dashboard
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stolen_vehicle_ai_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - PROJECT_NAME=Indian Police Stolen Vehicle AI Command Center
      - VERSION=1.0.0
      - DATABASE_URL=sqlite:////app/data/stolen_vehicle_ai.db
      - MAX_SPEED_KMH=120.0
      - MIN_PLATE_CONFIDENCE=0.50
      - SECTION_65B_HASH_ALGORITHM=sha256
      - CORS_ORIGINS=["*"]
    volumes:
      # Persistent local volume mounts for SQLite DB, evidence media & cameras
      - ./data:/app/data
      - ./data/evidence:/app/data/evidence
      - ./data/synthetic_feeds:/app/data/synthetic_feeds
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - police_network

  # ---------------------------------------------------------------------------
  # 2. Optional Enterprise Database (PostgreSQL 16) - Activate via '--profile prod'
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: stolen_vehicle_ai_postgres
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: police_admin
      POSTGRES_PASSWORD: police_secure_password_2026
      POSTGRES_DB: stolen_vehicle_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U police_admin -d stolen_vehicle_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - police_network

networks:
  police_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
